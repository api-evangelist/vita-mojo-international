aid: vita-mojo-international
name: Vita Mojo International
description: Vita Mojo International is a London-based hospitality technology company
  behind VMOS, an end-to-end order management system for quick-service restaurants
  that unifies point of sale, self-service kiosks, digital ordering, click-and-collect,
  kitchen management, menu management, loyalty, and data analytics (including the
  Scout AI analyst). Launched in 2015 and backed by Battery Ventures, Vita Mojo powers
  3,100+ locations for brands such as Subway, GAIL's, LEON, Honest Burgers, and YO!,
  primarily in the UK and Netherlands. Its integration surface is partner-oriented, with
  a partner-gated Reporting API, an EPOS Connector that delivers VMOS orders via webhooks
  in supported formats, and a catalog of technology partner integrations; first-party
  JavaScript libraries are published publicly on npm under the @vita-mojo scope.
